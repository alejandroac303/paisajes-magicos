<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <title>Video De Pereira y Armenia - Paisaje Mágico</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 15px;
            background-color: #ffffff;
        }

        .contenedor {
            border: 3px solid #208060;
            padding: 12px;
            background-color: #ffffff;
        }

        .cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 6px;
            margin-bottom: 12px;
            border-bottom: 2px solid #ff0000;
        }

        .logo-img {
            width: 260px;
            height: auto;
        }

        .titulo-cabecera {
            font-size: 26px;
            font-weight: bold;
            color: #000000;
        }

        .avion-img {
            width: 280px;
            height: auto;
        }

        .cuerpo {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 12px;
        }

        .menu a {
            display: block;
            text-decoration: none;
        }

        .menu button {
            display: block;
            width: 100%;
            margin: 6px 0;
            padding: 8px;
            background-color: #b0e8d8;
            border: 1px solid #208060;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover {
            background-color: #70d0b0;
        }

        .zona-contenido {
            border: 2px solid #208060;
            background-color: #e8f8f8;
            padding: 30px;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .boton-superior {
            align-self: flex-end;
            background-color: #208060;
            color: #ffffff;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 3px;
            margin-bottom: 30px;
        }

        .contenedor-video {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }

        .boton-lateral {
            background-color: #5bc8d8;
            color: #000000;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
        }

        .boton-lateral:hover {
            background-color: #4ab8c8;
        }

        .video-principal {
            flex: 1;
            max-width: 650px;
        }

        video {
            width: 100%;
            height: auto;
            border: 2px solid #208060;
            border-radius: 4px;
        }

        /* TABLET */
        @media (max-width: 900px) {
            .cuerpo {
                grid-template-columns: 1fr;
            }
            .contenedor-video {
                flex-direction: column;
            }
            .zona-contenido {
                margin: 20px 0;
            }
            .cabecera {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                text-align: center;
            }
            .logo-img, .avion-img {
                width: 200px;
            }
            .titulo-cabecera {
                font-size: 21px;
            }
        }

        /* CELULAR */
        @media (max-width: 500px) {
            body {
                margin: 7px;
            }
            .logo-img, .avion-img {
                width: 160px;
            }
            .titulo-cabecera {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <div class="cabecera">
            <img src="img/logo.png" alt="Logo Paisaje Mágico" class="logo-img">
            <div class="titulo-cabecera">AGENCIA DE VIAJES</div>
            <img src="img/avion.png" alt="Avión" class="avion-img">
        </div>

        <div class="cuerpo">
            <div class="menu">
                <a href="index.html"><button>Inicio</button></a>
                <a href="mision.html"><button>Mision y Vision</button></a>
                <a href="objetivos.html"><button>Objetivos especificos</button></a>
                <a href="historia.html"><button>Historia de Pereira y Armenia</button></a>
                <a href="fotosArmenia.html"><button>fotos armenia</button></a>
                <a href="fotosPereira.html"><button>Fotos pereira</button></a>
                <a href="quienesSomos.html"><button>¿Quienes Somos?</button></a>
                <a href="contactenos.html"><button>Contactenos</button></a>
                <a href="ubicacion.html"><button>Ubicación</button></a>
                <button>Video De Pereira y Armenia</button>
            </div>

            <div class="zona-contenido">
                <button class="boton-superior">Video De Pereira</button>

                <div class="contenedor-video">
                    <a href="videoArmenia.html">
                        <button class="boton-lateral">Video De Armenia</button>
                    </a>
                    
                    <div class="video-principal">
                        <video controls>
                            <source src="img/vpereira12.mp4" type="video/mp4">
                            Tu navegador no soporta el elemento de video.
                        </video>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
